name: One-time Rift branch formatting

on:
  push:
    branches: ["feature/rift-events"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rift-events
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Format the complete Rust workspace
        run: cargo fmt --all
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "Rust sources are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style: format Rust workspace"
          git push origin HEAD:feature/rift-events
