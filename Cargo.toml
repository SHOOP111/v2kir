[package]
name = "aetherfall"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A modular procedural top-down action roguelite in Rust."
authors = ["SHOOP111"]

[dependencies]
macroquad = "0.4.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
overflow-checks = false
panic = "abort"

[profile.dev]
opt-level = 1
